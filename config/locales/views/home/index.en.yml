      about: About Me
      blurb_html: |
        <p>
          Hi! I'm Jason.
        </p>
        <p>
          I live in Oregon with my wife, Shandy.
        </p>
        <p>
          I'm a writer. Mostly of horror. I'm currently querying my first novel,
          <i>The Burning Ones</i>:
        </p>
        <p>
          The burning girl is always there, a featureless silhouette, wreathed in flames. She
          follows Matthew wherever he goes, and she is always watching.
        </p>
        <p>
          No one else can see her, but when anyone comes too near, they are overcome by
          inexplicable dread. So, Matthew lives an isolated life, which, after his sister's
          accidental death some seventeen years ago, is all he deserves.
        </p>
        <p>
          Until Ember finds him. She can see the burning girl and says she can help. There's a
          sanctuary in the mountains with others who are haunted by the burning ones. Ember was
          once similarly haunted, but now she's free, and Matthew can be, too, if he comes with her.
        </p>
        <p>
          Except things feel wrong in Ember's sanctuary town. Matthew struggles with proximity
          after years of isolation, but it's more than that. People who are "freed" are different
          than before, and Matthew can't help but wonder if Ember is performing an exorcism or a
          possession. The burning girl is always watching. And maybe she wants in.
        </p>
        <p>
          I am a member of the <a href="https://horror.org/" target="_blank">HWA</a>. My short
          fiction has appeared in
          <a href="https://pseudopod.org/people/jason-rush/" target="_blank">PseudoPod</a>,
          and I won first place in the Zebulon contest at the
          <a href="https://pikespeakwriters.com/" target="_blank">Pikes Peak Writers Conference</a>.
        </p>
        <p>
          You can <a href="mailto:jasonrush@jasonrush.com" target="_blank">email me</a>, find me on
          <a rel="me" href="https://social.horrorhub.club/@jasonrush" target="_blank">Mastodon</a>,
          <a href="https://www.instagram.com/thejasonrush/" target="_blank">Instagram</a>,
          <a href="https://www.facebook.com/thejasonrush" target="_blank">Facebook</a>, and
          <a href="https://app.thestorygraph.com/profile/jasonrush" target="_blank">Story Graph</a>.
        </p>
