      about: About Me
      blurb_html: |
        <p>
          Hi! I'm Jason.
        </p>
        <p>
          I live in Oregon with my wife, Shandy.
        </p>
        <p>
          I'm a writer. Mostly of horror. I'm currently querying my first novel,
          <i>The Burning Ones</i>:
        </p>
        <p>
          The burning girl is always there, a featureless silhouette, wrapped in flames. She
          follows Matthew wherever he goes. She is always watching.
        </p>
        <p>
          No one else can see her, but they feel her, overcome by inexplicable dread when they
          come too near. So, Matthew lives alone and isolated, which, after the accidental death of
          his sister seventeen years ago, is all he deserves.
        </p>
        <p>
          Until Ember finds him. She can see the burning girl and says she can help. There's a
          sanctuary in the mountains where others who are haunted by burning ones live. Like
          Matthew, Ember was once haunted, but now she's free, and Matthew can be, too, if he comes
          with her.
        </p>
        <p>
          But things feel wrong in Ember's sanctuary town. People who are "freed" are different
          than before, and Matthew can't help but wonder if Ember is performing an exorcism or
          assisted possession. The burning girl is always watching. And maybe she wants in.
        </p>
        <p>
          My writing has won first place in the Zebulon contest at the
          <a href="https://pikespeakwriters.com/" target="_blank">Pikes Peak Writers Conference</a>.
          I'm a member of the <a href="https://horror.org/" target="_blank">HWA</a>, and my short
          fiction has appeared in
          <a href="https://pseudopod.org/people/jason-rush/" target="_blank">Pseudopod</a>.
        </p>
        <p>
          You can <a href="mailto:jasonrush@jasonrush.com" target="_blank">email me</a>, find me on
          <a rel="me" href="https://social.horrorhub.club/@jasonrush" target="_blank">Mastodon</a>,
          <a href="https://www.instagram.com/thejasonrush/" target="_blank">Instagram</a>,
          <a href="https://www.facebook.com/thejasonrush" target="_blank">Facebook</a>, and
          <a href="https://app.thestorygraph.com/profile/jasonrush" target="_blank">Story Graph</a>.
        </p>
